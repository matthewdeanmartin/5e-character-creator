<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Character Creator</h1>
        <p>Build your D&D 5th Edition character.</p>
        <button id="createCharacterBtn" class="button" disabled>Wait to Create New Character...</button>
        <button id="editCharacterBtn" class="button cancel-btn" disabled>Wait to Load Existing Character...</button>
    </div>

    <!-- The Character Creator Modal -->
    <div id="creatorModal" class="modal-overlay">
        <div class="modal-content">
            <!-- Header for Character Summary -->
            <div class="creator-header">
                <div class="summary-item">Name: <span id="summary-name">N/A</span></div>
                <div class="summary-item">Race: <span id="summary-race">N/A</span></div>
                <div class="summary-item">Class: <span id="summary-class">N/A</span></div>
            </div>

            <!-- Body for the steps -->
            <div class="creator-body">
                <!-- Step 1: Initial Setup -->
                <div id="step-1" class="creator-step">
                    <h2>Initial Character Setup</h2>
                    <div class="form-group">
                        <label for="charName">Character Name</label>
                        <input type="text" id="charName" class="form-control" placeholder="e.g., Eldrin Lightfinger">
                    </div>
                    <div class="form-group">
                        <label for="charRace">Race</label>
                        <select id="charRace" class="form-control"></select>
                    </div>
                    <div class="form-group hidden" id="subrace-group">
                        <label for="charSubrace">Subrace</label>
                        <select id="charSubrace" class="form-control" disabled></select>
                    </div>
                    <div class="form-group">
                        <label for="charClass">Class</label>
                        <select id="charClass" class="form-control"></select>
                    </div>
                    <div class="form-group">
                        <label for="charBackground">Background</label>
                        <select id="charBackground" class="form-control"></select>
                    </div>
                </div>

                <!-- Step 2: Ability Scores -->
                <div id="step-2" class="creator-step">
                    <h2>Set Ability Scores</h2>

                    <div class="point-buy-pool">
                        <h3>Points Remaining</h3>
                        <div id="points-pool-display" class="points-pool-value">27</div>
                    </div>

                    <div class="ability-scores-grid">
                        <!-- Strength -->
                        <div class="ability-score-row">
                            <label for="score-str" class="ability-label">Strength</label>
                            <input type="number" id="score-str" class="ability-input" data-ability="str" min="3" max="20" value="8" readonly>
                            <div class="ability-controls">
                                <button class="ability-btn" data-ability="str" data-action="decrease" aria-label="Decrease Strength">-</button>
                                <button class="ability-btn" data-ability="str" data-action="increase" aria-label="Increase Strength">+</button>
                            </div>
                            <div id="str-modifier" class="ability-modifier">+0</div>
                        </div>
                        <!-- Dexterity -->
                        <div class="ability-score-row">
                            <label for="score-dex" class="ability-label">Dexterity</label>
                            <input type="number" id="score-dex" class="ability-input" data-ability="dex" min="1" max="20" value="8" readonly>
                            <div class="ability-controls">
                                <button class="ability-btn" data-ability="dex" data-action="decrease" aria-label="Decrease Dexterity">-</button>
                                <button class="ability-btn" data-ability="dex" data-action="increase" aria-label="Increase Dexterity">+</button>
                            </div>
                            <span class="ability-modifier" id="mod-dex">+0</span>
                        </div>
                        <!-- Constitution -->
                        <div class="ability-score-row">
                            <label for="score-con" class="ability-label">Constitution</label>
                            <input type="number" id="score-con" class="ability-input" data-ability="con" min="1" max="20" value="8" readonly>
                            <div class="ability-controls">
                                <button class="ability-btn" data-ability="con" data-action="decrease" aria-label="Decrease Constitution">-</button>
                                <button class="ability-btn" data-ability="con" data-action="increase" aria-label="Increase Constitution">+</button>
                            </div>
                            <span class="ability-modifier" id="mod-con">+0</span>
                        </div>
                        <!-- Intelligence -->
                        <div class="ability-score-row">
                            <label for="score-int" class="ability-label">Intelligence</label>
                            <input type="number" id="score-int" class="ability-input" data-ability="int" min="1" max="20" value="8" readonly>
                            <div class="ability-controls">
                                <button class="ability-btn" data-ability="int" data-action="decrease" aria-label="Decrease Intelligence">-</button>
                                <button class="ability-btn" data-ability="int" data-action="increase" aria-label="Increase Intelligence">+</button>
                            </div>
                            <span class="ability-modifier" id="mod-int">+0</span>
                        </div>
                        <!-- Wisdom -->
                        <div class="ability-score-row">
                            <label for="score-wis" class="ability-label">Wisdom</label>
                            <input type="number" id="score-wis" class="ability-input" data-ability="wis" min="1" max="20" value="8" readonly>
                            <div class="ability-controls">
                                <button class="ability-btn" data-ability="wis" data-action="decrease" aria-label="Decrease Wisdom">-</button>
                                <button class="ability-btn" data-ability="wis" data-action="increase" aria-label="Increase Wisdom">+</button>
                            </div>
                            <span class="ability-modifier" id="mod-wis">+0</span>
                        </div>
                        <!-- Charisma -->
                        <div class="ability-score-row">
                            <label for="score-cha" class="ability-label">Charisma</label>
                            <input type="number" id="score-cha" class="ability-input" data-ability="cha" min="1" max="20" value="8" readonly>
                            <div class="ability-controls">
                                <button class="ability-btn" data-ability="cha" data-action="decrease" aria-label="Decrease Charisma">-</button>
                                <button class="ability-btn" data-ability="cha" data-action="increase" aria-label="Increase Charisma">+</button>
                            </div>
                            <span class="ability-modifier" id="mod-cha">+0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Persistent Footer -->
            <div class="creator-footer">
                <div style="display: flex; gap: 10px;">
                    <button id="saveBtn" class="button">Save Character</button>
                    <button id="loadBtn" class="button cancel-btn">Load Character</button>
                </div>
                <div class="navigation-buttons">
                    <button id="prevBtn" class="button cancel-btn">Previous</button>
                    <button id="nextBtn" class="button">Next</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Wasm Setup Scripts -->
    <script src="wasm_exec.js"></script>
    <script type="module" src="js/main.js"></script>

</body>
</html>
